# Load NVIDIA DRM/KMS in initramfs so the DRM device is ready before SDDM
# opens it — otherwise gamescope/greetd race the module and you get blank
# screens or flicker on session start.
# += not =: conf.d drop-ins are sourced after mkinitcpio.conf, so a plain
# assignment would clobber any MODULES the user set there.
MODULES+=(nvidia nvidia_modeset nvidia_uvm nvidia_drm)
