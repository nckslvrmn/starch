# Load NVIDIA DRM/KMS in the initramfs so the DRM device is ready before SDDM
# opens it. Otherwise gamescope races the module and session start gives you a
# blank screen or flicker.
# += not =, because conf.d drop-ins are sourced after mkinitcpio.conf and a plain
# assignment would clobber whatever MODULES were set there.
MODULES+=(nvidia nvidia_modeset nvidia_uvm nvidia_drm)
