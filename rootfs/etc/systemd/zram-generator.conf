# Managed by starch. Compressed swap in RAM — the safety net for Proton shader
# compiles and leaky games. Without any swap an OOM is a hard freeze with no
# recovery path in a gamescope session. Pairs with vm.swappiness=180 /
# vm.page-cluster=0 in sysctl.d/99-starch-gaming.conf (zram wants aggressive
# swapping of cold pages; it's RAM-speed, not disk).
[zram0]
zram-size = ram / 2
compression-algorithm = zstd
