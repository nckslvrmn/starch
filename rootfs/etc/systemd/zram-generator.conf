# Managed by starch. Compressed swap in RAM, the safety net for Proton shader
# compiles and leaky games: with no swap at all an OOM is a hard freeze with no
# recovery path inside a gamescope session. Pairs with vm.swappiness=180 and
# vm.page-cluster=0 in sysctl.d/99-starch-gaming.conf.
[zram0]
zram-size = ram / 2
compression-algorithm = zstd
