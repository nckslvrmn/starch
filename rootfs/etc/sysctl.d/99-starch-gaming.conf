# zram is the only swap here (see systemd/zram-generator.conf) and it runs at RAM
# speed, so swap cold pages aggressively and don't readahead in clusters. These
# values assume zram and are wrong for disk swap.
vm.swappiness=180
vm.page-cluster=0
vm.watermark_boost_factor=0

# Steam monitors a large number of files; the default (8192) is too low.
fs.inotify.max_user_watches=524288
fs.inotify.max_user_instances=512

# Proton/WINE create many memory-mapped regions; default trips ENOMEM.
vm.max_map_count=2147483642

# Uncap the RT reserve so gamescope --rt (SCHED_RR) isn't throttled. The default
# 5%-per-period reserve stalls the compositor under load. This disables the RT
# throttle entirely, so a runaway SCHED_RR thread could hard-lock the box, but
# gamescope is the only RT user here.
kernel.sched_rt_runtime_us=-1

# Don't trap on x86 split-lock atomics. Some games and anti-cheat DLLs hit split
# locks, and the kernel's default response (warn plus a 10ms sleep) stutters.
kernel.split_lock_mitigate=0

# Proactive background compaction causes frame-time hitches on long sessions.
# On-demand compaction at allocation time still runs.
vm.compaction_proactiveness=0

# Burns a perf counter and periodic cycles for hard-lockup detection nobody needs
# on a gaming box.
kernel.nmi_watchdog=0
