# zram is the only swap (see systemd/zram-generator.conf), and it's RAM-speed:
# swap cold pages aggressively and don't readahead in clusters. These values
# are wrong for disk swap — they assume zram.
vm.swappiness=180
vm.page-cluster=0
vm.watermark_boost_factor=0

# Steam monitors a large number of files; the default (8192) is too low.
fs.inotify.max_user_watches=524288
fs.inotify.max_user_instances=512

# Proton/WINE create many memory-mapped regions; default trips ENOMEM.
vm.max_map_count=2147483642

# Uncap the RT reserve so gamescope --rt (SCHED_RR) isn't throttled; the default
# 5%-per-period reserve stalls the compositor under load.
# Tradeoff, accepted deliberately: this disables the RT throttle entirely, so a
# runaway SCHED_RR thread could hard-lock the box. gamescope is the only RT
# user here and systemd-oomd handles the memory side of runaway processes.
kernel.sched_rt_runtime_us=-1

# Don't trap on x86 split-lock atomics. Some games and anti-cheat DLLs hit
# split locks; the kernel's default response (warn + 10ms sleep) stutters.
kernel.split_lock_mitigate=0

# Disable proactive background memory compaction (frame-time hitches on
# long sessions). On-demand compaction at allocation time still runs.
vm.compaction_proactiveness=0

# The NMI watchdog burns a perf counter and periodic cycles for hard-lockup
# detection we don't need on a gaming box.
kernel.nmi_watchdog=0
