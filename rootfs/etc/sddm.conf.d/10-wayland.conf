[General]
DisplayServer=wayland
GreeterEnvironment=QT_QPA_PLATFORM=wayland

[Wayland]
CompositorCommand=cage -s
# List sessions only from the starch-owned dir, not /usr/share/wayland-sessions.
# This keeps the river package's own river.desktop (and any other system
# session) out of the greeter — only steam/starch-river show up.
SessionDir=/usr/local/share/wayland-sessions

[Users]
RememberLastUser=true
DefaultUser=@@GAMING_USER@@

[Theme]
Current=starch
