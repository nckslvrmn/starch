[General]
DisplayServer=wayland
GreeterEnvironment=QT_QPA_PLATFORM=wayland

[Wayland]
CompositorCommand=cage -s
# Sessions only from the starch-owned dir, not /usr/share/wayland-sessions, so
# the river package's own river.desktop and any other system session stay out of
# the greeter.
SessionDir=/usr/local/share/wayland-sessions

[Users]
RememberLastUser=true
DefaultUser=@@GAMING_USER@@

[Theme]
Current=starch
