# NM is a passive connectivity monitor only — networkd (wired) + iwd (WiFi) own
# the network. It's here because Steam's online check queries NM over D-Bus.
# These options stop NM DHCP-ing over networkd or creating its own profiles.

[main]
no-auto-default=*
plugins=keyfile

[connectivity]
uri=http://nmcheck.gnome.org/check_network_status.txt
interval=300
