name: ci
on: [push, pull_request]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: bash -n every script
        run: |
          set -e
          for f in install.sh \
                   rootfs/usr/local/bin/* \
                   rootfs/usr/local/bin/steamos-polkit-helpers/* \
                   rootfs/usr/bin/* \
                   rootfs/usr/local/lib/starch/* \
                   userfs/.config/river/init; do
            [ -f "$f" ] || continue
            # shebang'd scripts and shebang-less sourced libs (shellcheck directive)
            head -1 "$f" | grep -q '^#!.*\(bash\|sh\)\|^# shellcheck shell=' || continue
            bash -n "$f"
            echo "OK: $f"
          done

      - name: shfmt parse (single Go binary; stricter parser than bash -n)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shfmt
          set -e
          for f in install.sh \
                   rootfs/usr/local/bin/* \
                   rootfs/usr/local/bin/steamos-polkit-helpers/* \
                   rootfs/usr/bin/* \
                   rootfs/usr/local/lib/starch/* \
                   userfs/.config/river/init; do
            [ -f "$f" ] || continue
            head -1 "$f" | grep -q '^#!.*\(bash\|sh\)\|^# shellcheck shell=' || continue
            shfmt -ln bash "$f" >/dev/null
            echo "OK: $f"
          done

      - name: river init must not name the 0.3 control CLI
        # river 0.4 greps its init file for that string and refuses to start
        # if it appears anywhere, comments included. Cost us a dead session.
        run: |
          if grep -q riverctl userfs/.config/river/init; then
            echo 'FAIL: userfs/.config/river/init names the 0.3 control CLI - river 0.4 will refuse to start'
            grep -n riverctl userfs/.config/river/init
            exit 1
          fi
          echo 'OK: userfs/.config/river/init'

      - name: parse canoe.toml
        # canoe silently skips entries it can't parse, so a typo here is a
        # keybinding that just never fires. Catch the file-level breakage at
        # least.
        run: |
          python3 -c "import tomllib; tomllib.load(open('userfs/.config/canoe/canoe.toml','rb'))"
          echo "OK: userfs/.config/canoe/canoe.toml"

      - name: validate session desktop files
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq desktop-file-utils
          desktop-file-validate rootfs/usr/local/share/wayland-sessions/*.desktop
          desktop-file-validate rootfs/usr/local/share/applications/*.desktop
