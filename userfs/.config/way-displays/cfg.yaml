# Managed by starch. ORDER is a left-to-right preference list and the first
# output present becomes primary. Externals first so docking takes over,
# internal as the fallback. Names match connector name or EDID description.
ORDER:
  - 'HDMI-A-1'
  - 'HDMI-A-2'
  - 'DP-1'
  - 'DP-2'
  - 'eDP-1'

# Every output at 100%, so nothing gets bitmap-scaled and blurry. Text is
# enlarged through the font-DPI env vars in river/init instead, which stays
# crisp.
AUTO_SCALE: FALSE

# Use each output's highest mode, not just its preferred one.
MAX_PREFERRED_REFRESH: FALSE

DISABLED: []

# Empty list = adaptive sync allowed everywhere. Pinned so a way-displays default
# change can't silently flip it.
VRR_OFF: []

LOG_THRESHOLD: INFO
