# starch default MangoHud config, used by gamescope --mangoapp in the Steam
# session and by MANGOHUD=1 launch options on the desktop.
legacy_layout=false
horizontal
hud_no_margin
table_columns=14
font_size=22
background_alpha=0.4

fps
frametime
frame_timing=1
gpu_stats
gpu_temp
gpu_power
cpu_stats
cpu_temp
ram
vram
battery

toggle_hud=Shift_R+F12
toggle_fps_limit=Shift_L+F1
fps_limit=0,60,90,120
