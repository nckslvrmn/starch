# starch fuzzel launcher (Super+Space).
#
# river/init exports Xft.dpi 120 and fuzzel is dpi-aware by default, so the size
# below would get scaled on top of that. dpi-aware=no pins the point size
# instead, decoupled from the text scaling done for GTK and Qt apps.

[main]
font=monospace:size=18
dpi-aware=no
# Roomier rows so the bigger text isn't cramped.
line-height=34
prompt=" "

[colors]
# Solid black launcher.
background=000000ff
text=ffffffff
prompt=ffffffff
input=ffffffff
match=8ab4f8ff
selection=222222ff
selection-text=ffffffff
selection-match=8ab4f8ff
border=000000ff

[border]
width=1
radius=0
