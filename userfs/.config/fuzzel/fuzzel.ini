# starch fuzzel launcher (Super+Space in river).
#
# Note: river/init exports Xft.dpi 120 and fuzzel is dpi-aware by default, so
# the size below is scaled up on top of that. dpi-aware=no pins the point size
# instead, decoupling it from the display-text scaling done for GTK/Qt apps.

[main]
font=monospace:size=18
dpi-aware=no
# Roomier rows so the larger text isn't cramped.
line-height=34
prompt=" "

[colors]
# Solid black launcher.
background=000000ff
text=ffffffff
prompt=ffffffff
input=ffffffff
match=8ab4f8ff
selection=222222ff
selection-text=ffffffff
selection-match=8ab4f8ff
border=000000ff

[border]
width=1
radius=0
