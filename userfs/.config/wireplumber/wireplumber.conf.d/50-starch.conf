# Managed by starch. Persist per-device state and let HDMI take over on connect.
# The restore settings below are 0.5 defaults, asserted explicitly so an upstream
# change can't silently disable them and bring back the "volume resets every
# boot" amnesia.
wireplumber.settings = {
  # Per-device route and its volume (HDMI and speakers each keep their level).
  device.restore-routes = true
  device.restore-profile = true

  # Restore the last default sink/source on login.
  node.restore-default-targets = true

  # Per-stream (per-app) volume.
  node.stream.restore-props = true
  node.stream.restore-target = true
}

# Follow-HDMI: default-nodes picks the highest-priority *available* sink, and an
# HDMI sink is only available while connected. Bumping it above the internal
# codec means docking takes over and unplugging returns to speakers. Nothing pins
# a configured default, which would defeat the whole thing.
#
# Two intentional interactions:
#  - BlueZ nodes default to priority ~2010, so connected BT headphones still
#    beat freshly plugged HDMI. Deliberate, don't "fix" it by going past 2010.
#  - Once a sink is picked manually (Steam's audio settings, wpctl), the restored
#    user preference outranks priority, so follow-HDMI pauses until that gets
#    cleared or re-picked. See README "Audio".
monitor.alsa.rules = [
  {
    matches = [
      { node.name = "~alsa_output.*[hH][dD][mM][iI].*" }
    ]
    actions = {
      update-props = {
        priority.session = 2000
        priority.driver  = 2000
        # Friendly name for Steam's audio menu and the sink-cycle OSD.
        node.description = "HDMI / TV"
      }
    }
  }
  # Friendly name for the internal codec. One node: speakers vs headphones is a
  # route on it, switched by jack detection.
  {
    matches = [
      { node.name = "~alsa_output.*analog-stereo.*" }
    ]
    actions = {
      update-props = {
        node.description = "Speakers / Headphones"
      }
    }
  }
]
