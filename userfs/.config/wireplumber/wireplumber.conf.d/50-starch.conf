# Managed by starch. Native WirePlumber audio (replaces the old virtual-sink
# setup): persist per-device state and let HDMI take over on connect. These
# restore settings are 0.5 defaults, asserted explicitly so an upstream change
# can't silently disable them — the old setup wiped this state, hence the
# "volume resets every boot" amnesia.
wireplumber.settings = {
  # Per-device route + its volume/mute (HDMI and speakers each keep their level).
  device.restore-routes = true
  device.restore-profile = true

  # Restore the last default sink/source on login.
  node.restore-default-targets = true

  # Per-stream (per-app) volume.
  node.stream.restore-props = true
  node.stream.restore-target = true
}

# Follow-HDMI: default-nodes picks the highest-priority *available* sink, and an
# HDMI sink is only available while connected. Bump it above the internal codec
# so docking takes over and unplug returns to speakers. We don't pin a
# configured default, which would defeat this.
#
# Two intentional interactions:
#  - BlueZ nodes default to priority ~2010, so connected BT headphones still
#    beat freshly plugged HDMI. Deliberate — don't "fix" by raising past 2010.
#  - Once a sink is picked manually (Steam audio settings, wpctl), the restored
#    user preference outranks priority, so follow-HDMI pauses until the
#    preference is cleared or re-picked. See README "Audio".
monitor.alsa.rules = [
  {
    matches = [
      { node.name = "~alsa_output.*[hH][dD][mM][iI].*" }
    ]
    actions = {
      update-props = {
        priority.session = 2000
        priority.driver  = 2000
      }
    }
  }
]
